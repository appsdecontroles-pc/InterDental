<title>App Dentista Calendario</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: barra lateral de módulos + área de trabajo; en celular, barra superior + navegación inferior fija */
:root{
  --bg:#f2f6f5; --surface:#ffffff; --surface2:#e8efed; --ink:#13232a; --mute:#5b6d73; --line:#d6e0dd;
  --accent:#0e6b70; --accent-ink:#ffffff; --accent-soft:#dbeeed;
  --warn:#9a5208; --warn-soft:#fbead4; --bad:#b0303a; --bad-soft:#f8e0e1; --ok:#2c7539; --ok-soft:#e0f0e2;
  --demo:#5b3fa6; --demo-soft:#ece6fa;
  --f-ui:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:12px; --shadow:0 1px 2px rgba(10,30,35,.06),0 8px 24px rgba(10,30,35,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1618; --surface:#142124; --surface2:#1b2b2f; --ink:#e3eeec; --mute:#94a8aa; --line:#26393d;
  --accent:#4fc2c4; --accent-ink:#05282a; --accent-soft:#143a3c;
  --warn:#e6a65e; --warn-soft:#38291a; --bad:#ef8087; --bad-soft:#3a1e21; --ok:#7fd18d; --ok-soft:#1a3321;
  --demo:#b9a2f5; --demo-soft:#2a2244; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1618; --surface:#142124; --surface2:#1b2b2f; --ink:#e3eeec; --mute:#94a8aa; --line:#26393d;
  --accent:#4fc2c4; --accent-ink:#05282a; --accent-soft:#143a3c;
  --warn:#e6a65e; --warn-soft:#38291a; --bad:#ef8087; --bad-soft:#3a1e21; --ok:#7fd18d; --ok-soft:#1a3321;
  --demo:#b9a2f5; --demo-soft:#2a2244; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14.5px;line-height:1.45;-webkit-tap-highlight-color:transparent}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.mute{color:var(--mute)}
.num{font-variant-numeric:tabular-nums}
a{color:var(--accent)}

/* ---------- Botones y campos ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--mute)}
.btn.ghost:hover{color:var(--ink);background:var(--surface2)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.55;cursor:wait}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.icon-btn{border:0;background:var(--surface2);width:34px;height:34px;border-radius:50%;font-size:20px;line-height:1;cursor:pointer;color:var(--mute);flex:none}
label.f{display:grid;gap:5px;font-size:13px;font-weight:600;color:var(--mute);min-width:0}
label.f .req{color:var(--bad)}
input[type=text],input[type=email],input[type=tel],input[type=date],input[type=number],input[type=password],input[type=search],select,textarea{
  width:100%;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 11px;font-size:14.5px;color:var(--ink);font-weight:500}
textarea{resize:vertical;min-height:84px;line-height:1.5}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.span2{grid-column:span 2}.span3{grid-column:1/-1}
@media (max-width:620px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}.span2,.span3{grid-column:auto}}
.check{display:flex;gap:8px;align-items:flex-start;font-size:14px;font-weight:500;color:var(--ink);cursor:pointer}
.check input{margin-top:3px;accent-color:var(--accent);width:16px;height:16px;flex:none}
fieldset{border:0;padding:0;margin:0;display:grid;gap:12px;min-width:0}
legend{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--mute);padding:0;margin-bottom:2px}
.form-sec{display:grid;gap:12px;padding-block:14px;border-top:1px solid var(--line)}
.form-sec:first-child{border-top:0;padding-top:0}

/* ---------- Pills ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--surface2);color:var(--mute);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.pill.demo{background:var(--demo-soft);color:var(--demo)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}

/* ---------- Pantalla de acceso ---------- */
#login{min-height:100%;display:grid;place-items:center;padding-block:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.login-card{width:100%;max-width:440px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:var(--shadow);display:grid;gap:18px}
.brand{display:flex;align-items:center;gap:12px}
.brand-mark{width:42px;height:42px;border-radius:12px;background:var(--accent);display:grid;place-items:center;flex:none}
.brand-mark svg{width:24px;height:24px}
.brand h1{font-size:19px;font-weight:800}
.brand p{margin:0;font-size:13px;color:var(--mute)}
.demo-users{display:grid;gap:8px}
.demo-user{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:var(--surface);cursor:pointer;text-align:left;width:100%}
.demo-user:hover{border-color:var(--accent);background:var(--accent-soft)}
.demo-user b{display:block;font-size:14px}
.demo-user span{font-size:12.5px;color:var(--mute)}
.demo-user .pill{margin-left:auto}
.err{background:var(--bad-soft);color:var(--bad);padding:10px 12px;border-radius:10px;font-size:13.5px;font-weight:600}
.info{background:var(--accent-soft);color:var(--ink);padding:10px 12px;border-radius:10px;font-size:13.5px}
.infowarn{background:var(--warn-soft);color:var(--ink);padding:10px 12px;border-radius:10px;font-size:13.5px}

/* ---------- App ---------- */
#app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;height:100dvh}
.side .brand{padding:0 6px}
.side .brand h1{font-size:15px}
.nav{display:grid;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;border:0;background:transparent;padding:9px 10px;border-radius:9px;font-weight:600;font-size:14px;color:var(--mute);cursor:pointer;text-align:left}
.nav button svg{width:18px;height:18px;flex:none}
.nav button:hover{background:var(--surface2);color:var(--ink)}
.nav button.on{background:var(--accent-soft);color:var(--accent)}
.nav .badge{margin-left:auto;font-size:11px;font-weight:800;background:var(--warn-soft);color:var(--warn);padding:1px 7px;border-radius:999px}
.me{margin-top:auto;display:grid;gap:8px;padding:10px;border-radius:12px;background:var(--surface2)}
.me b{font-size:13.5px;display:block}
.me span{font-size:12px;color:var(--mute)}
.main{min-width:0;display:flex;flex-direction:column}
.demo-bar{background:var(--demo-soft);color:var(--demo);font-size:13px;font-weight:600;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.demo-bar button{border:0;background:transparent;color:var(--demo);font-weight:700;text-decoration:underline;cursor:pointer;padding:0;font-size:13px}
.topbar{display:none}
#view{padding-block:24px 48px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));max-width:1180px;width:100%;display:grid;gap:18px;align-content:start}
.vhead{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
.vhead h2{font-size:24px;font-weight:800}
.vhead p{margin:3px 0 0;color:var(--mute);font-size:14px;max-width:62ch}
.vhead .acts{display:flex;gap:8px;flex-wrap:wrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.panel-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel-h h3{font-size:15px;font-weight:700}
.panel-b{padding:16px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar input[type=search]{max-width:340px;flex:1 1 220px}
.seg{display:inline-flex;background:var(--surface2);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 11px;border-radius:8px;font-weight:600;font-size:13px;color:var(--mute);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:2px}
.stat b{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat span{font-size:13px;color:var(--mute);font-weight:600}
.stat.warn b{color:var(--warn)}
@media (max-width:900px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.two{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:980px){.two{grid-template-columns:minmax(0,1fr)}}

/* filas */
.rows{display:grid}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;align-items:center;padding:12px 16px;border-top:1px solid var(--line);cursor:pointer;text-align:left;background:transparent;border-left:0;border-right:0;border-bottom:0;width:100%}
.row:first-child{border-top:0}
.row:hover{background:var(--surface2)}
.row .t1{font-weight:700;font-size:14.5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row .t2{font-size:13px;color:var(--mute);display:flex;gap:4px 12px;flex-wrap:wrap}
.row .r{display:flex;gap:6px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.empty{padding:28px 16px;text-align:center;color:var(--mute);display:grid;gap:10px;justify-items:center}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);text-align:left;font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--surface2)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:8px;align-content:start;min-width:0}
.card .ch{display:flex;gap:10px;align-items:center}
.card .ch b{font-size:15px}
.card .meta{font-size:13px;color:var(--mute);display:grid;gap:2px}
.card .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;color:#fff;flex:none}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:7px 16px;font-size:14px}
.kv dt{color:var(--mute);font-weight:600;font-size:13px}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.roadmap{display:grid;gap:0;counter-reset:f}
.roadmap li{list-style:none;display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;padding:9px 0;border-top:1px dashed var(--line);font-size:13.5px}
.roadmap li:first-child{border-top:0}
.roadmap .n{width:24px;height:24px;border-radius:50%;background:var(--surface2);color:var(--mute);display:grid;place-items:center;font-size:12px;font-weight:800}
.roadmap li.now .n{background:var(--accent);color:var(--accent-ink)}
.roadmap b{display:block;font-size:14px}
.roadmap ol{margin:0;padding:0}

/* ---------- Modal ---------- */
#modalRoot,#confirmRoot{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding-block:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#confirmRoot{z-index:60}
.scrim{position:absolute;inset:0;background:rgba(6,18,20,.5)}
.modal{position:relative;background:var(--surface);border-radius:16px;width:100%;max-width:560px;max-height:100%;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3);min-width:0}
.modal.wide{max-width:860px}
.modal>header{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
.modal>header h2{font-size:17px;font-weight:800;flex:1;min-width:0}
.mbody{padding:18px;overflow:auto;display:grid;gap:14px;min-width:0}
.modal>footer{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line);align-items:center;flex-wrap:wrap}
.modal>footer .sp{flex:1}
@media (max-width:620px){
  #modalRoot{place-items:end center;padding:0}
  #modalRoot .modal{border-radius:16px 16px 0 0;max-height:94%;padding-bottom:env(safe-area-inset-bottom,0px)}
}
.aviso{max-height:240px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:13px;line-height:1.55;white-space:pre-wrap;background:var(--bg)}
.firma-wrap{display:grid;gap:6px}
.firma{width:100%;height:150px;border:1.5px dashed var(--line);border-radius:10px;background:#fff;touch-action:none;display:block}
.firma-img{max-width:260px;background:#fff;border-radius:8px;border:1px solid var(--line)}
.mat-row{display:grid;grid-template-columns:minmax(0,1fr) 90px 34px;gap:8px;align-items:center}
.quick{display:flex;gap:8px;flex-wrap:wrap}
.portal{display:flex;gap:10px 18px;flex-wrap:wrap;align-items:center;background:var(--surface2);border-radius:10px;padding:10px 12px}
.portal span{font-size:12px;color:var(--mute);display:block;font-weight:600}
.portal b{font-family:var(--f-mono);font-size:14px;overflow-wrap:anywhere}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;z-index:80;box-shadow:var(--shadow);max-width:calc(100% - 32px)}

/* ---------- Celular ---------- */
@media (max-width:860px){
  #app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .topbar{display:flex;align-items:center;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
  .topbar .brand-mark{width:32px;height:32px;border-radius:9px}
  .topbar .brand-mark svg{width:18px;height:18px}
  .topbar b{font-size:15px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bnav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:flex;overflow-x:auto;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .bnav button{flex:1 0 64px;border:0;background:transparent;display:grid;justify-items:center;gap:2px;padding:8px 4px;font-size:11px;font-weight:700;color:var(--mute);cursor:pointer}
  .bnav button svg{width:20px;height:20px}
  .bnav button.on{color:var(--accent)}
  #view{padding-block:18px calc(90px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .vhead h2{font-size:21px}
  .hide-m{display:none}
}
@media (min-width:861px){.bnav{display:none}}
@media (prefers-reduced-motion:no-preference){.modal{animation:up .18s ease-out}@keyframes up{from{transform:translateY(12px);opacity:.6}to{transform:none;opacity:1}}}
</style>

<div id="login" hidden></div>
<div id="app" hidden>
  <aside class="side">
    <div class="brand"><div class="brand-mark" aria-hidden="true"></div><div><h1 id="sideClinic">Clínica dental</h1><p>Expediente y gestión</p></div></div>

    <div class="topbar"><div class="brand-mark" aria-hidden="true"></div><b id="topClinic">Clínica dental</b><button class="btn sm ghost" data-act="perfil">Cuenta</button></div>
    <div class="demo-bar" id="demoBar" hidden></div>
    <section id="view" aria-live="polite"></section>
  </div>
  <nav class="bnav" id="bnav"></nav>
</div>
<div id="modalRoot" hidden></div>
<div id="confirmRoot" hidden></div>
<div id="toast" hidden></div>

/* ============================ UTILIDADES ============================ */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => new Intl.NumberFormat('es-MX', {style:'currency', currency:'MXN', maximumFractionDigits:2}).format(Number(n) || 0);
const newId = (p = '') => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const nowISO = () => new Date().toISOString();
const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase();

/* Guarda un documento y deja registro en la bitácora (quién, cuándo, qué). */
async function guardar(col, id, data, resumen, { nuevo = false, reemplazar = false } = {}) {
  id = id || newId();
  const stamp = { actualizado: nowISO(), actualizadoPor: S.me.id };
  if (nuevo) { stamp.creado = nowISO(); stamp.creadoPor = S.me.id; }
  const full = { ...data, ...stamp };
  const log = { fecha: nowISO(), uid: S.me.id, usuario: S.me.nombre, coleccion: col, docId: id, accion: nuevo ? 'Alta' : 'Cambio', resumen: resumen || '' };
  if (S.mode === 'demo') {
    S.data[col][id] = reemplazar ? full : { ...(S.data[col][id] || {}), ...full };
    S.data.bitacora[newId('b')] = log;
    demoPersist(); render();
  } else {
    const F = fb.F, b = F.writeBatch(fb.db);
    b.set(F.doc(fb.db, col, id), full, reemplazar ? {} : { merge: true });
    b.set(F.doc(F.collection(fb.db, 'bitacora')), log);
    await b.commit();
  }
  return id;
}

async function initFirebase() {
  const base = 'https://www.gstatic.com/firebasejs/10.12.2/';
  const [A0, A, F] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js')]);
  fb.A0 = A0; fb.A = A; fb.F = F;
  fb.app = A0.initializeApp(FIREBASE_CONFIG);
  fb.auth = A.getAuth(fb.app);
  fb.db = F.getFirestore(fb.app);
  A.onAuthStateChanged(fb.auth, onAuth);
}
async function onAuth(user) {
  if (S.bootstrapping) return;
  S.unsubs.forEach(u => { try { u(); } catch (e) {} }); S.unsubs = [];
  COLS.forEach(c => S.data[c] = {});
  if (!user) { S.me = null; showLogin(); return; }
  try {
    const snap = await fb.F.getDoc(fb.F.doc(fb.db, 'usuarios', user.uid));
    if (!snap.exists() || snap.data().activo === false) {
      await fb.A.signOut(fb.auth);
      showLogin('Tu cuenta no tiene acceso activo. Pide al administrador que la active.');
      return;
    }
    S.me = { id: user.uid, ...snap.data() };
    subscribe(); showApp();
  } catch (e) { showLogin('No se pudo leer tu cuenta: ' + e.message); }
}
function subscribe() {
  const F = fb.F;
  const watch = (col, ref) => S.unsubs.push(F.onSnapshot(ref || F.collection(fb.db, col), snap => {
    const o = {}; snap.forEach(d => o[d.id] = d.data()); S.data[col] = o;
    if (col === 'usuarios' && o[S.me.id]) S.me = { id: S.me.id, ...o[S.me.id] };
    render();
  }, err => toast('No se pudo leer ' + col + ': ' + err.message)));
  ['usuarios','sedes','insumos','tratamientos','pacientes','config'].forEach(c => watch(c));
  if (esAdmin()) {
    watch('cuotas');
    watch('bitacora', F.query(F.collection(fb.db, 'bitacora'), F.orderBy('fecha', 'desc'), F.limit(300)));
  } else {
    S.unsubs.push(F.onSnapshot(F.doc(fb.db, 'cuotas', S.me.id), d => { S.data.cuotas = d.exists() ? { [d.id]: d.data() } : {}; render(); }, () => {}));
  }
}

CAMBIOS AL AVISO

    .replaceAll('{DOMICILIO}', c.domicilio || '[Domicilio]')
    .replaceAll('{RESPONSABLE}', c.responsable || '[Responsable]')

}

let toastT;

function modal({ title, body, submit = 'Guardar', wide = false, onSubmit, footerLeft = '', onOpen }) {
  const root = $('#modalRoot');
  root.innerHTML = `<div class="scrim" data-close></div>
  <form class="modal ${wide ? 'wide' : ''}" id="mform" autocomplete="off">
    <header><h2>${title}</h2><button type="button" class="icon-btn" data-close aria-label="Cerrar">×</button></header>
    <div class="mbody">${body}<div class="err" id="mErr" hidden></div></div>
    <footer>${footerLeft}<span class="sp"></span>${onSubmit ? `<button type="button" class="btn ghost" data-close>Cancelar</button><button class="btn primary" type="submit" id="mSubmit">${submit}</button>` : '<button type="button" class="btn" data-close>Cerrar</button>'}</footer>
  </form>`;
  root.hidden = false;
  $$('[data-close]', root).forEach(b => b.onclick = closeModal);
  const f = $('#mform');
  f.onsubmit = async e => {
    e.preventDefault(); if (!onSubmit) return;
    const btn = $('#mSubmit'), er = $('#mErr'); er.hidden = true; btn.disabled = true;
    try { const r = await onSubmit(f); if (r !== false) closeModal(); }
    catch (err) { er.textContent = errMsg(err); er.hidden = false; er.scrollIntoView({ block: 'nearest' }); }
    finally { btn.disabled = false; }
  };
  if (onOpen) onOpen(f);
  const first = f.querySelector('input:not([type=hidden]):not([type=checkbox]),select,textarea'); if (first && window.innerWidth > 860) first.focus();
  return f;
}
function closeModal() { const r = $('#modalRoot'); r.hidden = true; r.innerHTML = ''; }
function formErr(f, msg) { const er = $('#mErr', f); er.textContent = msg; er.hidden = false; er.scrollIntoView({ block: 'nearest' }); return false; }
function confirmar(titulo, texto, { ok = 'Confirmar', peligro = false } = {}) {
  return new Promise(res => {
    const r = $('#confirmRoot');
    r.innerHTML = `<div class="scrim"></div><div class="modal" role="alertdialog" aria-modal="true"><header><h2>${titulo}</h2></header><div class="mbody"><p style="margin:0">${texto}</p></div><footer><span class="sp"></span><button class="btn ghost" id="cNo">Cancelar</button><button class="btn ${peligro ? 'danger' : 'primary'}" id="cSi">${ok}</button></footer></div>`;

}

function estadoConsent(p) {
  const v = clinica().aviso?.version || 1;
  if (!p.consentimiento?.aceptado) return '<span class="pill warn">Sin consentimiento</span>';
  if ((p.consentimiento.version || 1) < v) return '<span class="pill warn">Aviso actualizado: firmar de nuevo</span>';
  return '<span class="pill ok">Consentimiento firmado</span>';
}
function filaPaciente(p, corto = false) {
  const e = edad(p.fechaNac), d = get('usuarios', p.dentistaResp), s = get('sedes', p.sedePref);
  return `<button class="row" data-act="pac-ver" data-id="${p.id}">
    <div style="min-width:0"><div class="t1">${esc(nombreCompleto(p))}${e !== null && e < 18 ? '<span class="pill">Menor de edad</span>' : ''}${p.estado === 'baja' ? '<span class="pill bad">Baja</span>' : ''}</div>
    <div class="t2"><span>${e !== null ? e + ' años' : ''}</span><span class="mono">${esc(p.telefono || '')}</span>${!corto && d ? `<span>${esc(d.nombre)}</span>` : ''}${!corto && s ? `<span>${esc(s.nombre)}</span>` : ''}</div></div>
    <div class="r">${corto ? '' : estadoConsent(p)}</div></button>`;
}
function filtrarPacientes() {
  const q = norm(S.ui.pacQ).trim(), qd = telDigits(S.ui.pacQ), f = S.ui.pacF, v = clinica().aviso?.version || 1;
  return list('pacientes').filter(p => {
    if (f === 'activos' && p.estado === 'baja') return false;
    if (f === 'baja' && p.estado !== 'baja') return false;
    if (f === 'mios' && (p.dentistaResp !== S.me.id || p.estado === 'baja')) return false;
    if (f === 'consent' && (p.estado === 'baja' || (p.consentimiento?.aceptado && (p.consentimiento.version || 1) >= v))) return false;
    if (!q) return true;
    const hay = norm(nombreCompleto(p) + ' ' + (p.email || '') + ' ' + usuarioPortal(p));
    return q.split(/\s+/).every(w => hay.includes(w)) || (qd.length >= 3 && telDigits(p.telefono).includes(qd));
  }).sort((a, b) => nombreCompleto(a).localeCompare(nombreCompleto(b)));
}

      <label class="f">Teléfono<input type="tel" name="telefono" id="fsTel" value="${esc(s.telefono)}"></label>
      <label class="f span2">Dirección<input type="text" name="direccion" id="fsDir" value="${esc(s.direccion)}"></label>
      <label class="f span2">Consultorios o sillones<input type="text" name="consultorios" id="fsCons" value="${esc((s.consultorios || []).join(', '))}" placeholder="Consultorio 1, Consultorio 2"><span class="mute" style="font-weight:500;font-size:12.5px">Sepáralos con comas. Se usan para la agenda.</span></label>
      <label class="check span2"><input type="checkbox" name="activo" id="fsActivo" ${s.activo !== false ? 'checked' : ''}> Activa</label></div>`,
    onSubmit: async f => {
      const data = { nombre: fv(f, 'nombre'), tipo: fv(f, 'tipo'), telefono: fv(f, 'telefono'), direccion: fv(f, 'direccion'), consultorios: fv(f, 'consultorios').split(',').map(x => x.trim()).filter(Boolean), activo: f.elements.activo.checked };
      await guardar('sedes', id, data, (id ? 'Editó sede ' : 'Agregó sede ') + data.nombre, { nuevo: !id }); toast('Sede guardada.');
    } });
}

/* ============================ VISTA: CLÍNICA Y AVISO ============================ */
function vClinica() {
  const c = clinica(), a = c.aviso || { version: 1, texto: AVISO_BASE };
  const firmados = list('pacientes').filter(p => p.estado !== 'baja' && p.consentimiento?.aceptado && (p.consentimiento.version || 1) >= a.version).length;
  return `<div class="vhead"><div><h2>Aviso y clínica</h2><p>Datos generales y aviso de privacidad. Al cambiar el texto del aviso se crea una nueva versión y los pacientes deben firmarla de nuevo.</p></div></div>
  <div class="two">
    <form class="panel" id="clinForm"><div class="panel-h"><h3>Datos de la clínica</h3></div><div class="panel-b grid2">
      <label class="f span2">Nombre comercial<input type="text" name="nombre" id="ccNombre" value="${esc(c.nombre)}" required></label>
      <label class="f span2">Responsable de los datos personales<input type="text" name="responsable" id="ccResp" value="${esc(c.responsable)}"></label>
      <label class="f span2">Domicilio<input type="text" name="domicilio" id="ccDom" value="${esc(c.domicilio)}"></label>
      <label class="f">Teléfono<input type="tel" name="telefono" id="ccTel" value="${esc(c.telefono)}"></label>
      <label class="f">Correo para derechos ARCO<input type="email" name="correo" id="ccCorreo" value="${esc(c.correo)}"></label>
      <div class="span2"><button class="btn primary" type="submit">Guardar datos</button></div></div></form>
    <div class="panel"><div class="panel-h"><h3>Aviso de privacidad</h3><span class="pill acc">v${a.version}</span><span class="mute" style="font-size:13px">desde ${fechaCorta(a.fecha)}</span></div><div class="panel-b" style="display:grid;gap:10px">
      <p style="margin:0">${firmados} pacientes activos tienen firmada la versión vigente.</p>
      <div class="aviso">${esc(avisoTexto())}</div>
      <div><button class="btn" data-act="aviso-editar">Editar texto del aviso</button></div>
      <span class="mute" style="font-size:12.5px">Las marcas {CLINICA}, {DOMICILIO}, {RESPONSABLE} y {CORREO} se llenan con los datos de la clínica.</span></div></div>
  </div>`;
}
function formAviso() {
  const c = clinica(), a = c.aviso || { version: 1, texto: AVISO_BASE };
  modal({ title: 'Editar aviso de privacidad', wide: true, submit: 'Guardar como nueva versión', body: `<div class="infowarn">Al guardar se crea la versión v${a.version + 1}. Los pacientes con la versión anterior aparecerán como pendientes de firma.</div><label class="f">Texto del aviso<textarea name="texto" id="faTexto" style="min-height:340px;font-size:13.5px" required>${esc(a.texto)}</textarea></label>`,
    onSubmit: async f => {
      const texto = f.elements.texto.value.trim();
      if (texto === (a.texto || '').trim()) return formErr(f, 'No hay cambios en el texto.');
      await guardar('config', 'clinica', { aviso: { version: a.version + 1, texto, fecha: nowISO() } }, `Publicó la versión ${a.version + 1} del aviso de privacidad`); toast(`Aviso v${a.version + 1} publicado.`);
    } });
}

/* ============================ VISTA: BITÁCORA ============================ */
function vBitacora() {
  const us = list('usuarios').sort((a, b) => a.nombre.localeCompare(b.nombre));
  const rows = list('bitacora').filter(b => !S.ui.bitU || b.uid === S.ui.bitU).sort((a, b) => (b.fecha || '').localeCompare(a.fecha || '')).slice(0, 300);
  const COL = { pacientes: 'Pacientes', usuarios: 'Equipo', tratamientos: 'Catálogo', insumos: 'Insumos', sedes: 'Sedes', config: 'Clínica', cuotas: 'Cuotas' };
  return `<div class="vhead"><div><h2>Bitácora</h2><p>Registro de quién hizo cada cambio y cuándo. No se puede editar ni borrar.</p></div></div>
  <div class="panel"><div class="panel-h"><select id="bitU" data-change="bitU" style="max-width:280px">${opt('', 'Todos los usuarios', S.ui.bitU)}${us.map(u => opt(u.id, u.nombre, S.ui.bitU)).join('')}</select><span class="mute" style="font-size:13px">Últimos ${rows.length} movimientos</span></div>
  <div class="tablewrap"><table><thead><tr><th>Fecha</th><th>Usuario</th><th>Módulo</th><th>Detalle</th></tr></thead><tbody>
  ${rows.map(b => `<tr><td class="num" style="white-space:nowrap">${fechaHora(b.fecha)}</td><td>${esc(b.usuario)}</td><td><span class="pill">${COL[b.coleccion] || esc(b.coleccion)}</span></td><td>${esc(b.resumen)}</td></tr>`).join('') || '<tr><td colspan="4"><div class="empty">Sin movimientos.</div></td></tr>'}
  </tbody></table></div></div>`;
}

/* ============================ EVENTOS ============================ */
const ACT = {
  nav: el => go(el.dataset.view), salir, perfil: () => verPerfil(),
  'reset-demo': async () => { if (!await confirmar('Restablecer datos de ejemplo', 'Se borran los cambios que hiciste en esta demostración y se cargan de nuevo los datos de ejemplo.', { ok: 'Restablecer', peligro: true })) return; const uid = S.me.id; seedDemo(); S.me = get('usuarios', uid) || get('usuarios', 'u_admin'); render(); toast('Datos de ejemplo restablecidos.'); },
  'pac-nuevo': () => formPaciente(), 'pac-ver': el => verPaciente(el.dataset.id), 'pac-filtro': el => { S.ui.pacF = el.dataset.f; render(); },
  'cat-tab': el => { S.ui.catTab = el.dataset.tab; S.ui.catQ = ''; render(); }, 'cat-ejemplo': cargarCatalogoEjemplo,
  'tr-nuevo': () => formTratamiento(), 'tr-ver': el => verTratamiento(el.dataset.id), 'in-nuevo': () => formInsumo(), 'in-editar': el => formInsumo(el.dataset.id),
  'us-nuevo': () => formUsuario(), 'us-editar': el => formUsuario(el.dataset.id), cuotas: el => formCuotas(el.dataset.id), 'mis-cuotas': () => formCuotas(S.me.id, true),
  'se-nuevo': () => formSede(), 'se-editar': el => formSede(el.dataset.id), 'aviso-editar': formAviso
};
function verPerfil() {
  modal({ title: 'Mi cuenta', body: `<div class="ch" style="display:flex;gap:12px;align-items:center"><span class="avatar" style="background:${esc(S.me.color || '#0e6b70')}">${esc(iniciales(S.me.nombre))}</span><div><b>${esc(S.me.nombre)}</b><div class="mute">${esc(S.me.email)} · ${ROLES[S.me.rol]}</div></div></div>`,
    footerLeft: `<button type="button" class="btn sm" id="ppSalir">${S.mode === 'demo' ? 'Cambiar de usuario' : 'Cerrar sesión'}</button>`, onOpen: () => $('#ppSalir').onclick = () => { closeModal(); salir(); } });
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.closest('#modalRoot form') && !el.closest('.mbody')) return;
  const fn = ACT[el.dataset.act]; if (fn) { e.preventDefault(); Promise.resolve(fn(el)).catch(err => toast(errMsg(err))); }
});
document.addEventListener('input', e => { const k = e.target.dataset?.input; if (k) { S.ui[k] = e.target.value; render(); } });
document.addEventListener('change', e => { const k = e.target.dataset?.change; if (k) { S.ui[k] = e.target.value; render(); } });
document.addEventListener('submit', async e => {
  if (e.target.id !== 'clinForm') return; e.preventDefault(); const f = e.target;
  try { await guardar('config', 'clinica', { nombre: fv(f, 'nombre'), responsable: fv(f, 'responsable'), domicilio: fv(f, 'domicilio'), telefono: fv(f, 'telefono'), correo: fv(f, 'correo') }, 'Actualizó los datos de la clínica'); toast('Datos de la clínica guardados.'); }
  catch (err) { toast(errMsg(err)); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (!$('#confirmRoot').hidden) return; if (!$('#modalRoot').hidden) closeModal(); } });

/* ============================ ARRANQUE ============================ */
(async function start() {
  if (S.mode === 'demo') { if (!demoLoad() || !Object.keys(S.data.usuarios).length) seedDemo(); showLogin(); return; }
  $('#login').hidden = false; $('#login').innerHTML = '<div class="login-card"><p class="mute" style="margin:0">Conectando…</p></div>';
  try { await initFirebase(); }
  catch (e) { $('#login').innerHTML = `<div class="login-card"><div class="err">No se pudo conectar con Firebase. Revisa la configuración y tu conexión.<br><small>${esc(e.message)}</small></div></div>`; }
})();
</script>
