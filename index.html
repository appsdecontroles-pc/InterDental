<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>App Dentista Calendario</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: barra lateral de módulos + área de trabajo; en celular, barra superior + navegación inferior fija */
:root{
  --bg:#f2f6f5; --surface:#ffffff; --surface2:#e8efed; --ink:#13232a; --mute:#5b6d73; --line:#d6e0dd;
  --accent:#0e6b70; --accent-ink:#ffffff; --accent-soft:#dbeeed;
  --warn:#9a5208; --warn-soft:#fbead4; --bad:#b0303a; --bad-soft:#f8e0e1; --ok:#2c7539; --ok-soft:#e0f0e2;
  --demo:#5b3fa6; --demo-soft:#ece6fa;
  --f-ui:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:12px; --shadow:0 1px 2px rgba(10,30,35,.06),0 8px 24px rgba(10,30,35,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1618; --surface:#142124; --surface2:#1b2b2f; --ink:#e3eeec; --mute:#94a8aa; --line:#26393d;
  --accent:#4fc2c4; --accent-ink:#05282a; --accent-soft:#143a3c;
  --warn:#e6a65e; --warn-soft:#38291a; --bad:#ef8087; --bad-soft:#3a1e21; --ok:#7fd18d; --ok-soft:#1a3321;
  --demo:#b9a2f5; --demo-soft:#2a2244; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1618; --surface:#142124; --surface2:#1b2b2f; --ink:#e3eeec; --mute:#94a8aa; --line:#26393d;
  --accent:#4fc2c4; --accent-ink:#05282a; --accent-soft:#143a3c;
  --warn:#e6a65e; --warn-soft:#38291a; --bad:#ef8087; --bad-soft:#3a1e21; --ok:#7fd18d; --ok-soft:#1a3321;
  --demo:#b9a2f5; --demo-soft:#2a2244; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14.5px;line-height:1.45;-webkit-tap-highlight-color:transparent}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.mute{color:var(--mute)}
.num{font-variant-numeric:tabular-nums}
a{color:var(--accent)}

/* ---------- Botones y campos ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--mute)}
.btn.ghost:hover{color:var(--ink);background:var(--surface2)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.55;cursor:wait}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.icon-btn{border:0;background:var(--surface2);width:34px;height:34px;border-radius:50%;font-size:20px;line-height:1;cursor:pointer;color:var(--mute);flex:none}
label.f{display:grid;gap:5px;font-size:13px;font-weight:600;color:var(--mute);min-width:0}
label.f .req{color:var(--bad)}
input[type=text],input[type=email],input[type=tel],input[type=date],input[type=number],input[type=password],input[type=search],select,textarea{
  width:100%;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 11px;font-size:14.5px;color:var(--ink);font-weight:500}
textarea{resize:vertical;min-height:84px;line-height:1.5}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.span2{grid-column:span 2}.span3{grid-column:1/-1}
@media (max-width:620px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}.span2,.span3{grid-column:auto}}
.check{display:flex;gap:8px;align-items:flex-start;font-size:14px;font-weight:500;color:var(--ink);cursor:pointer}
.check input{margin-top:3px;accent-color:var(--accent);width:16px;height:16px;flex:none}
fieldset{border:0;padding:0;margin:0;display:grid;gap:12px;min-width:0}
legend{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--mute);padding:0;margin-bottom:2px}
.form-sec{display:grid;gap:12px;padding-block:14px;border-top:1px solid var(--line)}
.form-sec:first-child{border-top:0;padding-top:0}

/* ---------- Pills ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--surface2);color:var(--mute);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.pill.demo{background:var(--demo-soft);color:var(--demo)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}

/* ---------- Pantalla de acceso ---------- */
#login{min-height:100%;display:grid;place-items:center;padding-block:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.login-card{width:100%;max-width:440px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:var(--shadow);display:grid;gap:18px}
.brand{display:flex;align-items:center;gap:12px}
.brand-mark{width:42px;height:42px;border-radius:12px;background:var(--accent);display:grid;place-items:center;flex:none}
.brand-mark svg{width:24px;height:24px}
.brand h1{font-size:19px;font-weight:800}
.brand p{margin:0;font-size:13px;color:var(--mute)}
.demo-users{display:grid;gap:8px}
.demo-user{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:var(--surface);cursor:pointer;text-align:left;width:100%}
.demo-user:hover{border-color:var(--accent);background:var(--accent-soft)}
.demo-user b{display:block;font-size:14px}
.demo-user span{font-size:12.5px;color:var(--mute)}
.demo-user .pill{margin-left:auto}
.err{background:var(--bad-soft);color:var(--bad);padding:10px 12px;border-radius:10px;font-size:13.5px;font-weight:600}
.info{background:var(--accent-soft);color:var(--ink);padding:10px 12px;border-radius:10px;font-size:13.5px}
.infowarn{background:var(--warn-soft);color:var(--ink);padding:10px 12px;border-radius:10px;font-size:13.5px}

/* ---------- App ---------- */
#app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;height:100dvh}
.side .brand{padding:0 6px}
.side .brand h1{font-size:15px}
.nav{display:grid;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;border:0;background:transparent;padding:9px 10px;border-radius:9px;font-weight:600;font-size:14px;color:var(--mute);cursor:pointer;text-align:left}
.nav button svg{width:18px;height:18px;flex:none}
.nav button:hover{background:var(--surface2);color:var(--ink)}
.nav button.on{background:var(--accent-soft);color:var(--accent)}
.nav .badge{margin-left:auto;font-size:11px;font-weight:800;background:var(--warn-soft);color:var(--warn);padding:1px 7px;border-radius:999px}
.me{margin-top:auto;display:grid;gap:8px;padding:10px;border-radius:12px;background:var(--surface2)}
.me b{font-size:13.5px;display:block}
.me span{font-size:12px;color:var(--mute)}
.main{min-width:0;display:flex;flex-direction:column}
.demo-bar{background:var(--demo-soft);color:var(--demo);font-size:13px;font-weight:600;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.demo-bar button{border:0;background:transparent;color:var(--demo);font-weight:700;text-decoration:underline;cursor:pointer;padding:0;font-size:13px}
.topbar{display:none}
#view{padding-block:24px 48px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));max-width:1180px;width:100%;display:grid;gap:18px;align-content:start}
.vhead{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
.vhead h2{font-size:24px;font-weight:800}
.vhead p{margin:3px 0 0;color:var(--mute);font-size:14px;max-width:62ch}
.vhead .acts{display:flex;gap:8px;flex-wrap:wrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.panel-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel-h h3{font-size:15px;font-weight:700}
.panel-b{padding:16px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar input[type=search]{max-width:340px;flex:1 1 220px}
.seg{display:inline-flex;background:var(--surface2);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 11px;border-radius:8px;font-weight:600;font-size:13px;color:var(--mute);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:2px}
.stat b{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat span{font-size:13px;color:var(--mute);font-weight:600}
.stat.warn b{color:var(--warn)}
@media (max-width:900px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.two{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:980px){.two{grid-template-columns:minmax(0,1fr)}}

/* filas */
.rows{display:grid}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;align-items:center;padding:12px 16px;border-top:1px solid var(--line);cursor:pointer;text-align:left;background:transparent;border-left:0;border-right:0;border-bottom:0;width:100%}
.row:first-child{border-top:0}
.row:hover{background:var(--surface2)}
.row .t1{font-weight:700;font-size:14.5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row .t2{font-size:13px;color:var(--mute);display:flex;gap:4px 12px;flex-wrap:wrap}
.row .r{display:flex;gap:6px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.empty{padding:28px 16px;text-align:center;color:var(--mute);display:grid;gap:10px;justify-items:center}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);text-align:left;font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--surface2)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:8px;align-content:start;min-width:0}
.card .ch{display:flex;gap:10px;align-items:center}
.card .ch b{font-size:15px}
.card .meta{font-size:13px;color:var(--mute);display:grid;gap:2px}
.card .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;color:#fff;flex:none}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:7px 16px;font-size:14px}
.kv dt{color:var(--mute);font-weight:600;font-size:13px}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.roadmap{display:grid;gap:0;counter-reset:f}
.roadmap li{list-style:none;display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;padding:9px 0;border-top:1px dashed var(--line);font-size:13.5px}
.roadmap li:first-child{border-top:0}
.roadmap .n{width:24px;height:24px;border-radius:50%;background:var(--surface2);color:var(--mute);display:grid;place-items:center;font-size:12px;font-weight:800}
.roadmap li.now .n{background:var(--accent);color:var(--accent-ink)}
.roadmap b{display:block;font-size:14px}
.roadmap ol{margin:0;padding:0}

/* ---------- Modal ---------- */
#modalRoot,#confirmRoot{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding-block:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#confirmRoot{z-index:60}
.scrim{position:absolute;inset:0;background:rgba(6,18,20,.5)}
.modal{position:relative;background:var(--surface);border-radius:16px;width:100%;max-width:560px;max-height:100%;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3);min-width:0}
.modal.wide{max-width:860px}
.modal>header{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
.modal>header h2{font-size:17px;font-weight:800;flex:1;min-width:0}
.mbody{padding:18px;overflow:auto;display:grid;gap:14px;min-width:0}
.modal>footer{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line);align-items:center;flex-wrap:wrap}
.modal>footer .sp{flex:1}
@media (max-width:620px){
  #modalRoot{place-items:end center;padding:0}
  #modalRoot .modal{border-radius:16px 16px 0 0;max-height:94%;padding-bottom:env(safe-area-inset-bottom,0px)}
}
.aviso{max-height:240px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:13px;line-height:1.55;white-space:pre-wrap;background:var(--bg)}
.firma-wrap{display:grid;gap:6px}
.firma{width:100%;height:150px;border:1.5px dashed var(--line);border-radius:10px;background:#fff;touch-action:none;display:block}
.firma-img{max-width:260px;background:#fff;border-radius:8px;border:1px solid var(--line)}
.mat-row{display:grid;grid-template-columns:minmax(0,1fr) 90px 34px;gap:8px;align-items:center}
.quick{display:flex;gap:8px;flex-wrap:wrap}
.portal{display:flex;gap:10px 18px;flex-wrap:wrap;align-items:center;background:var(--surface2);border-radius:10px;padding:10px 12px}
.portal span{font-size:12px;color:var(--mute);display:block;font-weight:600}
.portal b{font-family:var(--f-mono);font-size:14px;overflow-wrap:anywhere}

/* Fase 2: expediente */
.sp{flex:1}
.exp-head{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.exp-title{display:grid;gap:6px;min-width:0;flex:1}
.exp-title h2{font-size:24px;font-weight:800}
.exp-meta{display:flex;gap:6px 12px;flex-wrap:wrap;align-items:center;color:var(--mute);font-size:13.5px}
.alerta{display:flex;gap:4px 12px;flex-wrap:wrap;align-items:baseline;background:var(--bad-soft);color:var(--ink);border-radius:12px;padding:10px 14px;font-size:14px}
.alerta b{color:var(--bad);text-transform:uppercase;letter-spacing:.06em;font-size:12px}
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:-6px}
.tabs button{border:0;background:transparent;padding:10px 14px;font-weight:700;font-size:14px;color:var(--mute);cursor:pointer;border-bottom:2.5px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.bar{height:8px;border-radius:999px;background:var(--surface2);overflow:hidden}
.bar span{display:block;height:100%;background:var(--accent);border-radius:999px}
.tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tools .tl{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);min-width:96px}
.toolbtn{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink)}
.toolbtn.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.sw{width:11px;height:11px;border-radius:3px;display:inline-block;flex:none}
.odowrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
svg.odo{display:block;width:100%;min-width:700px;height:auto;user-select:none}
svg.odo .face{fill:var(--surface);stroke:var(--mute);stroke-width:1;cursor:pointer}
svg.odo .face:hover{fill:var(--accent-soft)}
svg.odo .face.on:hover{opacity:.85}
svg.odo .hit{fill:transparent;cursor:pointer}
svg.odo .tooth.sel .hit{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2}
svg.odo .tooth.aus .face{opacity:.35}
svg.odo .num{font:600 12px var(--f-mono);fill:var(--ink);text-anchor:middle;cursor:pointer}
svg.odo .mk{fill:none;stroke-width:2.6;stroke-linecap:round;pointer-events:none}
svg.odo .mk.dash{stroke-dasharray:4 3}
svg.odo .mk.thin{stroke-width:1}
svg.odo .imp{fill:#9aa4ad;stroke:var(--ink);stroke-width:1}
svg.odo .tag{font:800 11px var(--f-ui);fill:#8a6d3b;text-anchor:end}
svg.odo .notadot{fill:var(--mute)}
svg.odo .pend{fill:var(--accent)}
svg.odo .axis{stroke:var(--line);stroke-width:1;stroke-dasharray:3 4}
svg.odo .side{font:600 10px var(--f-ui);fill:var(--mute);text-transform:uppercase;letter-spacing:.08em}
.legend-row{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:12.5px;color:var(--mute);align-items:center}
.legend-row>span{display:inline-flex;gap:6px;align-items:center}
.pendsw{width:9px;height:9px;border-radius:50%;background:var(--accent);display:inline-block}
.mini{font-size:13px;display:flex;gap:8px;align-items:center}
.cita-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:8px;min-width:0}
.cita-card.done{background:var(--ok-soft)}
.cita-h{display:flex;gap:6px 12px;align-items:center;flex-wrap:wrap}
.cita-fecha{width:auto!important;padding:5px 8px!important;font-size:13.5px!important}
.mini-sel{width:auto!important;padding:4px 6px!important;font-size:13px!important;margin-right:6px}
tr.rowdone td{color:var(--mute)}
.icon-btn.sm{width:28px;height:28px;font-size:14px}
.timeline{display:grid;padding:8px 16px 16px}
.tl-item{display:grid;grid-template-columns:18px minmax(0,1fr);gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.tl-item:first-child{border-top:0}
.tl-dot{width:10px;height:10px;border-radius:50%;background:var(--mute);margin-top:6px}
.tl-dot.tx{background:var(--ok)}
.tl-h{display:flex;gap:6px 12px;flex-wrap:wrap;align-items:center;font-size:13.5px}
.tl-t{white-space:pre-wrap;font-size:14px;margin-top:3px}
/* Visor 3D */
.visor-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:980px){.visor-grid{grid-template-columns:minmax(0,1fr)}}
.visor-col{display:grid;gap:12px;min-width:0}
.visor{position:relative;height:58vh;min-height:340px;max-height:640px;border-radius:16px;overflow:hidden;background:radial-gradient(circle at 50% 38%,#29404f,#0d171e 75%);touch-action:none;user-select:none}

/* Guarda un documento y deja registro en la bitácora (quién, cuándo, qué). */
async function guardar(col, id, data, resumen, { nuevo = false, reemplazar = false } = {}) {
  id = id || newId();
  const stamp = { actualizado: nowISO(), actualizadoPor: S.me.id };
  if (nuevo) { stamp.creado = nowISO(); stamp.creadoPor = S.me.id; }
  const full = { ...data, ...stamp };
  const log = { fecha: nowISO(), uid: S.me.id, usuario: S.me.nombre, coleccion: col, docId: id, accion: nuevo ? 'Alta' : 'Cambio', resumen: resumen || '' };
  if (S.mode === 'demo') {
    S.data[col][id] = reemplazar ? full : { ...(S.data[col][id] || {}), ...full };
    S.data.bitacora[newId('b')] = log;
    demoPersist(); render();
  } else {
    const F = fb.F, b = F.writeBatch(fb.db);
    b.set(F.doc(fb.db, col, id), full, reemplazar ? {} : { merge: true });
    b.set(F.doc(F.collection(fb.db, 'bitacora')), log);
    await b.commit();
  }
  return id;
}

/* ---------- Firebase ---------- */
async function initFirebase() {
  const base = 'https://www.gstatic.com/firebasejs/10.12.2/';

async function onAuth(user) {
  if (S.bootstrapping) return;
  S.unsubs.forEach(u => { try { u(); } catch (e) {} }); S.unsubs = [];
  COLS.forEach(c => S.data[c] = {});
  if (!user) { S.me = null; showLogin(); return; }
  try {
    const snap = await fb.F.getDoc(fb.F.doc(fb.db, 'usuarios', user.uid));
    if (!snap.exists() || snap.data().activo === false) {
      await fb.A.signOut(fb.auth);

      return;

function subscribe() {
  const F = fb.F;
  const watch = (col, ref) => S.unsubs.push(F.onSnapshot(ref || F.collection(fb.db, col), snap => {

/* ============================ AVISO DE PRIVACIDAD (plantilla) ============================ */
const AVISO_BASE = `AVISO DE PRIVACIDAD INTEGRAL

1. RESPONSABLE DE SUS DATOS PERSONALES
{CLINICA}, operada por {RESPONSABLE}, con domicilio en {DOMICILIO}, es responsable del uso y protección de sus datos personales. Contacto: {CORREO} · {TELEFONO}. Este aviso aplica a nuestras sedes ({SEDES}) y a la atención que nuestros dentistas brinden en sedes externas cuando el expediente se lleve en nuestra plataforma.

2. DATOS PERSONALES QUE RECABAMOS
Los obtenemos directamente de usted, de su madre, padre o tutor si es menor de edad, o de profesionales de la salud que lo refieran.
• Identificación: nombre, fecha de nacimiento, sexo y ocupación.
• Contacto: celular, correo electrónico, domicilio, código postal y contacto de emergencia.
• Salud (DATOS SENSIBLES): antecedentes médicos y dentales, alergias, medicamentos, enfermedades, embarazo, diagnósticos, odontograma, radiografías, fotografías clínicas, modelos y escaneos digitales de su boca, plan de tratamiento y notas de evolución.
• Firma autógrafa o trazada en pantalla para consentimientos.
• Fiscales, solo si pide factura: RFC, nombre o razón social, régimen fiscal, código postal fiscal, uso de CFDI y constancia de situación fiscal.
• Patrimoniales: presupuestos, pagos, abonos, saldos y plan de pagos elegido.
No almacenamos números completos de tarjetas bancarias; los pagos con tarjeta los procesa directamente la terminal o pasarela de pago.

3. PARA QUÉ USAMOS SUS DATOS
Finalidades necesarias para su atención:
1) Integrar, actualizar y conservar su expediente clínico.
2) Valorarlo, diagnosticar y elaborar su plan de tratamiento, incluida su representación visual en 3D.
3) Brindarle los tratamientos y darles seguimiento, aun cuando lo atienda otro dentista de la clínica.
4) Agendar, confirmar, recordar y reprogramar sus citas por teléfono, WhatsApp o correo electrónico.
5) Elaborar presupuestos, registrar pagos y saldos, y administrar el plan de pagos que elija.
6) Tramitar sus facturas cuando las solicite.
7) Darle acceso a su portal personal para consultar su plan, citas y pagos.
8) Cumplir obligaciones sanitarias, fiscales y legales, y atender requerimientos de autoridades.
Finalidades adicionales (puede negarse sin que esto afecte su atención):
• Invitarlo a retomar un tratamiento pendiente o a su revisión periódica.
• Enviarle información sobre promociones o servicios de la clínica.
• Usar fotografías clínicas de forma anónima, sin mostrar su rostro ni datos que lo identifiquen, con fines académicos o de difusión, solo si lo autoriza expresamente.

4. CONSENTIMIENTO PARA DATOS SENSIBLES Y MENORES DE EDAD
Sus datos de salud son datos personales sensibles. Solo los tratamos con su consentimiento expreso y por escrito, que otorga al firmar este aviso en papel o en la pantalla de la clínica. La plataforma registra la fecha, la versión del aviso firmada y quién registró la firma. Si el paciente es menor de 18 años o no puede otorgar su consentimiento, firma su madre, padre o tutor, indicando su nombre y parentesco. Todos los dentistas de la clínica pueden consultar su expediente para dar continuidad a su atención; cada cambio queda registrado con el nombre de quien lo hizo y la fecha.

5. CON QUIÉN COMPARTIMOS SUS DATOS
• Laboratorios dentales y de imagen, para fabricar coronas, prótesis, guardas o aparatos y procesar estudios de su tratamiento.
• Otros profesionales de la salud a quienes lo refiramos, para la continuidad de su atención.
• Contador o proveedor de facturación, para emitir las facturas que solicite.
• Autoridades sanitarias, fiscales o judiciales, cuando la ley lo exija.
Además nos apoyamos en proveedores tecnológicos que guardan la información por cuenta nuestra y bajo nuestras instrucciones, sin usarla para fines propios: Google (Firebase, Gmail y Google Calendar) para la plataforma, los correos y la agenda, y WhatsApp para los mensajes que usted reciba. Estos servicios pueden almacenar información en servidores fuera de México con medidas de seguridad equivalentes. En la agenda y en los recordatorios solo aparecen su nombre, el tratamiento y la sede, nunca su diagnóstico. No vendemos ni cedemos sus datos a terceros.

6. SUS DERECHOS (ARCO), REVOCACIÓN Y LIMITACIÓN DE USO
Puede acceder a sus datos, rectificarlos si son inexactos, pedir su cancelación u oponerse a su uso para fines específicos. También puede revocar su consentimiento o limitar el uso de sus datos, por ejemplo para dejar de recibir invitaciones o promociones. Envíe su solicitud a {CORREO} o entréguela por escrito en recepción, con: 1) su nombre completo y un medio para responderle; 2) copia de su identificación oficial, o la de su representante legal y el documento que lo acredite; 3) descripción clara del derecho que desea ejercer y de los datos involucrados. Le responderemos dentro de los plazos que marca la ley. La cancelación o revocación no aplica a los datos que debemos conservar por obligación legal, como el expediente clínico; en ese caso los bloqueamos para que solo se usen cuando la ley lo exija.

7. CONSERVACIÓN, SEGURIDAD Y CAMBIOS
Conforme a la NOM-004-SSA3-2012, conservamos su expediente clínico por un mínimo de 5 años contados a partir de su última atención. Los datos fiscales y de pagos se conservan por el plazo que exigen las leyes fiscales. Su información se guarda en una plataforma con acceso protegido; cada integrante del equipo tiene permisos según su función y todos los cambios quedan registrados. Los expedientes no se borran: cuando un paciente deja de atenderse se da de baja y su información queda resguardada. Usted recibirá un usuario y contraseña personal para su portal; es su responsabilidad no compartirlos. La plataforma solo usa el almacenamiento técnico necesario para mantener la sesión; no usamos cookies de publicidad ni de rastreo. Cualquier cambio a este aviso se le informará en la clínica y en su portal, y le pediremos que firme la nueva versión.`;
function avisoTexto() {
  const c = clinica();
  return (c.aviso?.texto || AVISO_BASE)

function modal({ title, body, submit = 'Guardar', wide = false, onSubmit, footerLeft = '', onOpen }) {
  const root = $('#modalRoot');
  root.innerHTML = `<div class="scrim" data-close></div>
  <form class="modal ${wide ? 'wide' : ''}" id="mform" autocomplete="off">
    <header><h2>${title}</h2><button type="button" class="icon-btn" data-close aria-label="Cerrar">×</button></header>
    <div class="mbody">${body}<div class="err" id="mErr" hidden></div></div>
    <footer>${footerLeft}<span class="sp"></span>${onSubmit ? `<button type="button" class="btn ghost" data-close>Cancelar</button><button class="btn primary" type="submit" id="mSubmit">${submit}</button>` : '<button type="button" class="btn" data-close>Cerrar</button>'}</footer>
  </form>`;
  root.hidden = false;
  $$('[data-close]', root).forEach(b => b.onclick = closeModal);
  const f = $('#mform');
  f.onsubmit = async e => {
    e.preventDefault(); if (!onSubmit) return;
    const btn = $('#mSubmit'), er = $('#mErr'); er.hidden = true; btn.disabled = true;
    try { const r = await onSubmit(f); if (r !== false) closeModal(); }
    catch (err) { er.textContent = errMsg(err); er.hidden = false; er.scrollIntoView({ block: 'nearest' }); }
    finally { btn.disabled = false; }
  };
  if (onOpen) onOpen(f);
  const first = f.querySelector('input:not([type=hidden]):not([type=checkbox]),select,textarea'); if (first && window.innerWidth > 860) first.focus();
  return f;
}
function closeModal() { const r = $('#modalRoot'); r.hidden = true; r.innerHTML = ''; }
function formErr(f, msg) { const er = $('#mErr', f); er.textContent = msg; er.hidden = false; er.scrollIntoView({ block: 'nearest' }); return false; }
function confirmar(titulo, texto, { ok = 'Confirmar', peligro = false } = {}) {
  return new Promise(res => {
    const r = $('#confirmRoot');
    r.innerHTML = `<div class="scrim"></div><div class="modal" role="alertdialog" aria-modal="true"><header><h2>${titulo}</h2></header><div class="mbody"><p style="margin:0">${texto}</p></div><footer><span class="sp"></span><button class="btn ghost" id="cNo">Cancelar</button><button class="btn ${peligro ? 'danger' : 'primary'}" id="cSi">${ok}</button></footer></div>`;
    r.hidden = false;
    const done = v => { r.hidden = true; r.innerHTML = ''; res(v); };
    $('#cNo').onclick = () => done(false); $('#cSi').onclick = () => done(true); $('.scrim', r).onclick = () => done(false);
    $('#cSi').focus();
  });
}

function filtrarPacientes() {
  const q = norm(S.ui.pacQ).trim(), qd = telDigits(S.ui.pacQ), f = S.ui.pacF, v = clinica().aviso?.version || 1;
  return list('pacientes').filter(p => {
    if (f === 'activos' && p.estado === 'baja') return false;
    if (f === 'baja' && p.estado !== 'baja') return false;
    if (f === 'mios' && (p.dentistaResp !== S.me.id || p.estado === 'baja')) return false;
    if (f === 'consent' && (p.estado === 'baja' || (p.consentimiento?.aceptado && (p.consentimiento.version || 1) >= v))) return false;
    if (!q) return true;
    const hay = norm(nombreCompleto(p) + ' ' + (p.email || '') + ' ' + usuarioPortal(p));
    return q.split(/\s+/).every(w => hay.includes(w)) || (qd.length >= 3 && telDigits(p.telefono).includes(qd));
  }).sort((a, b) => nombreCompleto(a).localeCompare(nombreCompleto(b)));

function formCuotas(uid, soloLectura = false) {

/* ---------- Paso 3: revisar antes de importar ---------- */
function analizarArchivo(ent, wb) {
  const P = PLANTILLAS[ent];
  const nombreHoja = wb.SheetNames.find(n => nh(n) === nh(P.hoja)) || wb.SheetNames[0];
  const aoa = XLSX.utils.sheet_to_json(wb.Sheets[nombreHoja], { header: 1, raw: true, defval: '' });
  const idx = {};
  P.cols.forEach(c => [c.l, c.k, ...(c.alias || [])].forEach(n => idx[nh(n)] = c.k));
  /* fila de encabezados: la primera (de las 10 primeras) con más coincidencias */
  let hr = -1, best = 0;
  aoa.slice(0, 10).forEach((r, i) => { const m = r.filter(h => idx[nh(String(h).replace(/\*$/, ''))]).length + (ent === 'pacientes' && r.some(h => ['NOMBRECOMPLETO', 'PACIENTE', 'NOMBREDELPACIENTE'].includes(nh(h))) ? 2 : 0); if (m > best) { best = m; hr = i; } });
  if (hr < 0 || best < 1) throw new Error('No se encontraron encabezados reconocibles. Usa la plantilla descargada o revisa que la primera fila tenga los nombres de las columnas.');
  const heads = aoa[hr].map(h => String(h).replace(/\*\s*$/, '').trim());
  const map = {}, extras = [];
  heads.forEach((h, i) => { if (!h) return; const k = idx[nh(h)];
    if (k && map[k] == null) map[k] = i;
    else if (ent === 'pacientes' && ['NOMBRECOMPLETO', 'PACIENTE', 'NOMBREDELPACIENTE'].includes(nh(h))) map.__nombreCompleto = i;
    else extras.push({ nombre: h, i }); });
  const faltan = P.cols.filter(c => c.req && map[c.k] == null && !(ent === 'pacientes' && map.__nombreCompleto != null && ['nombres', 'apPaterno'].includes(c.k)));
  const existentes = new Map(list(P.coleccion).map(r => [P.claveExistente(r), r]));
  const vistos = new Map(), filas = [];
  aoa.slice(hr + 1).forEach((row, j) => {
    if (!row.some(v => String(v).trim() !== '')) return;
    const fila = hr + j + 2, errores = [], avisos = [], ctx = { aviso: m => avisos.push(m) };
    /* se arma sobre el registro existente para conservar objetos anidados */
    const tmp = {}; Object.assign(tmp, P.preparar(null));
    P.cols.forEach(c => { const i = map[c.k]; if (i == null) return; const v = row[i]; if (typeof v === 'string' ? v.trim() === '' : v === '' || v == null) return; const e = c.in(typeof v === 'string' ? v.trim() : v, tmp, ctx); if (e) errores.push(`${c.l}: ${e}`); });
    if (P.especial) P.especial(row, map, tmp, ctx);
    const k = P.clave(tmp);
    if (!k) errores.push(P.faltaClave);
    const ex = k ? existentes.get(k) : null;
    if (k && vistos.has(k)) errores.push(`Repetido: el mismo registro ya viene en la fila ${vistos.get(k)}`);
    if (k && !vistos.has(k)) vistos.set(k, fila);
    if (!ex && k) P.cols.filter(c => c.req).forEach(c => { if (tmp[c.k] === undefined || tmp[c.k] === '') { const msg = `${c.l}: es obligatoria para un registro nuevo`; if (!errores.some(x => x.startsWith(c.l))) errores.push(msg); } });
    const ext = {}; extras.forEach(x => { const v = row[x.i]; if (String(v).trim() !== '') ext[x.nombre] = typeof v === 'number' ? v : String(v).trim(); });
    filas.push({ fila, data: tmp, existe: ex, errores, avisos, extras: ext, titulo: P.nombreFila(ex ? { ...ex, ...tmp } : tmp) });
  });
  return { hoja: nombreHoja, filas, faltan, extras: extras.map(x => x.nombre), reconocidas: P.cols.filter(c => map[c.k] != null).map(c => c.l).concat(map.__nombreCompleto != null ? ['Nombre completo'] : []) };
}
function previsualizar(ent, wb, archivo) {

    <div class="info"><b>Columnas reconocidas:</b> ${R.reconocidas.map(esc).join(', ') || 'ninguna'}${R.extras.length ? `<br><b>Columnas adicionales:</b> ${R.extras.map(esc).join(', ')}` : ''}</div>

      ${R.extras.length ? `<label class="check"><input type="checkbox" id="imExt" checked> Guardar las columnas adicionales como datos extra de cada registro</label>` : ''}
    </div>

    onOpen: f => {

      f.addEventListener('change', e => { if (e.target.id === 'imAct' || e.target.id === 'imExt') upd(); });

      $('#mSubmit').textContent = 'Importando…';
      const n = await ejecutarImport(ent, R.filas.filter(r => ['nuevo', 'actualiza'].includes(estado(r))), opts);
      toast(`Importación terminada: ${n.nuevos} nuevos, ${n.actualizados} actualizados.`);
    } });
}
async function ejecutarImport(ent, filas, opts) {
  const P = PLANTILLAS[ent], t = nowISO(), ops = [];
  let nuevos = 0, actualizados = 0;
  filas.forEach(r => {
    const data = { ...r.data };
    if (opts.extras && Object.keys(r.extras).length) data.extras = { ...(r.existe?.extras || {}), ...r.extras };
    if (r.existe) {
      if (data.contactoEmergencia) data.contactoEmergencia = { ...(r.existe.contactoEmergencia || {}), ...Object.fromEntries(Object.entries(data.contactoEmergencia).filter(([, v]) => v)) };
      ops.push({ id: r.existe.id, data: { ...data, actualizado: t, actualizadoPor: S.me.id }, merge: true }); actualizados++;
    } else {
      const full = { ...P.base(), ...data, creado: t, creadoPor: S.me.id, actualizado: t, actualizadoPor: S.me.id };
      ops.push({ id: P.nuevoId(full), data: full, merge: false }); nuevos++;
    }
  });
  const log = { fecha: t, uid: S.me.id, usuario: S.me.nombre, coleccion: P.coleccion, docId: '*', accion: 'Importación', resumen: `Importó ${P.titulo.toLowerCase()} desde Excel: ${nuevos} nuevos, ${actualizados} actualizados` };
  if (S.mode === 'demo') {
    ops.forEach(o => S.data[P.coleccion][o.id] = o.merge ? { ...(S.data[P.coleccion][o.id] || {}), ...o.data } : o.data);
    S.data.bitacora[newId('b')] = log; demoPersist(); render();
  } else {
    const F = fb.F;
    for (let i = 0; i < ops.length; i += 400) {
      const b = F.writeBatch(fb.db);
      ops.slice(i, i + 400).forEach(o => b.set(F.doc(fb.db, P.coleccion, o.id), o.data, o.merge ? { merge: true } : {}));
      if (i + 400 >= ops.length) b.set(F.doc(F.collection(fb.db, 'bitacora')), log);
      await b.commit();
    }
  }
  return { nuevos, actualizados };
}

/* Guarda varios documentos en una sola operación, con un registro en la bitácora */
async function guardarLote(ops, resumen) {
  const t = nowISO();
  const items = ops.map(o => ({ col: o.col, id: o.id || newId(), data: { ...o.data, actualizado: t, actualizadoPor: S.me.id, ...(o.nuevo ? { creado: t, creadoPor: S.me.id } : {}) }, merge: !o.reemplazar }));
  const log = { fecha: t, uid: S.me.id, usuario: S.me.nombre, coleccion: ops[0].col, docId: items[0].id, accion: ops.some(o => o.nuevo) ? 'Alta' : 'Cambio', resumen };
  if (S.mode === 'demo') {
    items.forEach(o => S.data[o.col][o.id] = o.merge ? { ...(S.data[o.col][o.id] || {}), ...o.data } : o.data);
    S.data.bitacora[newId('b')] = log; demoPersist(); render();
  } else {
    const F = fb.F, b = F.writeBatch(fb.db);
    /* mergeFields: cada campo de primer nivel se reemplaza completo (así se pueden quitar dientes, caras o citas) */
    items.forEach(o => b.set(F.doc(fb.db, o.col, o.id), o.data, o.merge ? { mergeFields: Object.keys(o.data) } : {}));
    b.set(F.doc(F.collection(fb.db, 'bitacora')), log);
    await b.commit();
  }
  return items.map(o => o.id);
}

const dVacio = () => ({ estado: 'presente', caras: {}, hall: [], prev: [], nota: '' });

/* ---------------- Odontograma ---------------- */
function odoTrabajo(pid) {
  if (!S.ui.odo || S.ui.odo.pacId !== pid) S.ui.odo = { pacId: pid, data: deep(expedienteDe(pid).odontograma || {}) || {}, dirty: false, tool: 'c:caries', sel: [], ver: null };
  return S.ui.odo;
}
function carasCaja(fdi) {
  const q = Math.floor(fdi / 10), sup = q === 1 || q === 2, izq = q === 1 || q === 4;
  return { top: sup ? 'V' : 'L', bottom: sup ? 'L' : 'V', left: izq ? 'D' : 'M', right: izq ? 'M' : 'D', center: 'O' };
}
function odoSVG(data, { sel = [], pend = {}, interactivo = true } = {}) {
  const W = 40, G = 7, QG = 18, X0 = 14;
  const xOf = i => X0 + i * (W + G) + (i >= 8 ? QG : 0);
  const out = [];
  const tooth = (fdi, x, y, numY) => {
    const t = dNorm(data[fdi]), cc = carasCaja(fdi), act = interactivo ? `data-act="odo" data-fdi="${fdi}"` : '';
    const face = (k, pts) => { const v = t.caras[cc[k]], col = v ? T_CARA[v]?.c : ''; return `<polygon points="${pts}" class="face${v ? ' on' : ''}" ${col ? `style="fill:${col}"` : ''} ${interactivo ? `data-act="odo" data-fdi="${fdi}" data-cara="${cc[k]}"` : ''}><title>${fdi} · cara ${CARAS[cc[k]]}${v ? ': ' + T_CARA[v].l : ''}</title></polygon>`; };
    const P = (a) => a.map(([px, py]) => `${x + px},${y + py}`).join(' ');
    const ausente = t.estado === 'ausente', s = sel.includes(fdi);
    out.push(`<g class="tooth${ausente ? ' aus' : ''}${s ? ' sel' : ''}">`);
    out.push(`<rect x="${x - 3}" y="${Math.min(y, numY - 14) - 3}" width="${W + 6}" height="${W + 26}" rx="6" class="hit" ${act}></rect>`);
    out.push(`<text x="${x + W / 2}" y="${numY}" class="num" ${act}>${fdi}</text>`);
    out.push(face('top', P([[0, 0], [W, 0], [28, 12], [12, 12]])), face('bottom', P([[0, W], [W, W], [28, 28], [12, 28]])), face('left', P([[0, 0], [12, 12], [12, 28], [0, W]])), face('right', P([[W, 0], [W, W], [28, 28], [28, 12]])));
    const cv = t.caras.O, ccol = cv ? T_CARA[cv]?.c : '';
    out.push(`<rect x="${x + 12}" y="${y + 12}" width="16" height="16" class="face${cv ? ' on' : ''}" ${ccol ? `style="fill:${ccol}"` : ''} ${interactivo ? `data-act="odo" data-fdi="${fdi}" data-cara="O"` : ''}><title>${fdi} · cara oclusal / incisal${cv ? ': ' + T_CARA[cv].l : ''}</title></rect>`);
    if (ausente) out.push(`<path d="M${x - 2} ${y - 2} L${x + W + 2} ${y + W + 2} M${x + W + 2} ${y - 2} L${x - 2} ${y + W + 2}" class="mk" style="stroke:${T_DIENTE.ausente.c}" ${act}/>`);
    if (t.hall.includes('extraccion')) out.push(`<path d="M${x - 2} ${y - 2} L${x + W + 2} ${y + W + 2} M${x + W + 2} ${y - 2} L${x - 2} ${y + W + 2}" class="mk" style="stroke:${T_DIENTE.extraccion.c}" ${act}/>`);
    if (t.estado === 'retenido') out.push(`<rect x="${x - 4}" y="${y - 4}" width="${W + 8}" height="${W + 8}" rx="8" class="mk dash" style="stroke:${T_DIENTE.retenido.c}" ${act}/>`);
    if (t.prev.includes('corona')) out.push(`<circle cx="${x + W / 2}" cy="${y + W / 2}" r="${W / 2 + 3}" class="mk" style="stroke:${T_DIENTE.corona.c}" ${act}/>`);
    if (t.estado === 'implante') out.push(`<g ${act}><rect x="${x + 15}" y="${y + 6}" width="10" height="28" rx="3" class="imp"/><path d="M${x + 13} ${y + 13}h14M${x + 13} ${y + 20}h14M${x + 13} ${y + 27}h14" class="mk thin" style="stroke:var(--ink)"/></g>`);
    const ry = numY < y ? y - 9 : y + W + 4, rl = 6;
    if (t.prev.includes('endodoncia')) out.push(`<path d="M${x + W / 2 - 4} ${ry} v${rl}" class="mk" style="stroke:${T_DIENTE.endodoncia.c}" ${act}/>`);
    if (t.hall.includes('pulpa')) out.push(`<path d="M${x + W / 2 + 4} ${ry} v${rl}" class="mk" style="stroke:${T_DIENTE.pulpa.c}" ${act}/>`);
    if (t.hall.includes('fractura')) out.push(`<path d="M${x + 4} ${y + 6} l8 8 l-4 6 l10 10 l-3 6" class="mk" style="stroke:${T_DIENTE.fractura.c}" ${act}/>`);
    if (t.hall.includes('movilidad')) out.push(`<text x="${x + W - 2}" y="${numY}" class="tag" ${act}>M</text>`);
    if (t.nota) out.push(`<circle cx="${x + 3}" cy="${numY - 4}" r="2.5" class="notadot" ${act}><title>${esc(t.nota)}</title></circle>`);
    if (pend[fdi]) out.push(`<circle cx="${x + W / 2}" cy="${numY < y ? y + W + 9 : y - 9}" r="3.4" class="pend" ${act}><title>${pend[fdi]} tratamiento(s) en el plan</title></circle>`);
    out.push('</g>');
  };
  D_SUP.forEach((f, i) => tooth(f, xOf(i), 30, 20));
  D_INF.forEach((f, i) => tooth(f, xOf(i), 108, 166));
  const w = xOf(15) + W + 14;
  return `<svg class="odo" viewBox="0 0 ${w} 180" role="img" aria-label="Odontograma">
    <line x1="${xOf(8) - QG / 2 - G / 2}" y1="8" x2="${xOf(8) - QG / 2 - G / 2}" y2="174" class="axis"/><line x1="6" y1="94" x2="${w - 6}" y2="94" class="axis"/>
    <text x="8" y="90" class="side">Derecha</text><text x="${w - 8}" y="90" class="side" text-anchor="end">Izquierda</text>
    ${out.join('')}</svg>`;
}
function pendientesPorDiente(pid) {
  const pa = planActivo(pid), m = {};
  (pa?.items || []).filter(it => !['realizado', 'cancelado'].includes(it.estado)).forEach(it => (it.dientes || []).forEach(d => m[d] = (m[d] || 0) + 1));
  return m;
}

      <div class="odowrap">${odoSVG(O.data, { sel, pend: pendientesPorDiente(p.id) })}</div>
      <div class="legend-row"><span><span class="sw" style="background:${T_CARA.caries.c}"></span>Problema / pendiente</span><span><span class="sw" style="background:${T_CARA.resina.c}"></span>Tratamiento existente</span><span><span class="pendsw"></span>Tiene tratamiento en el plan</span>${ex.odoInicialFecha ? `<span class="mute">"Cómo llegó" guardado el ${fechaCorta(ex.odoInicialFecha)}</span>` : ''}</div>
    </div></div>
    ${vt ? `<div class="panel"><div class="panel-h"><h3>${ver} · ${nombreDiente(ver)}</h3><span class="sp"></span><button class="btn sm ghost" data-act="odo-ver-cerrar">Cerrar</button></div><div class="panel-b" style="display:grid;gap:10px">
      <p style="margin:0">${esc(dxTexto(vt))}</p>
      <label class="f">Nota del diente<input type="text" id="odoNota" data-fdi="${ver}" value="${esc(vt.nota)}" placeholder="Ej. sensibilidad al frío, fisura vertical"></label>
      ${(planActivo(p.id)?.items || []).filter(it => (it.dientes || []).includes(ver)).map(it => `<div class="mini">${ITEM_EST[it.estado] || ''} ${esc(it.nombre)} · ${money(precioItem(it))}</div>`).join('')}
    </div></div>` : ''}
    <div class="panel"><div class="panel-h"><h3>Hallazgos registrados</h3></div>${D_TODOS.filter(f => dTieneAlgo(O.data[f])).length ? `<div class="tablewrap"><table><tbody>${D_TODOS.filter(f => dTieneAlgo(O.data[f])).map(f => `<tr class="click" data-act="odo-ver" data-fdi="${f}"><td class="mono" style="width:60px"><b>${f}</b></td><td>${esc(nombreDiente(f))}</td><td>${dColor(O.data[f]) ? `<span class="dot" style="background:${dColor(O.data[f])}"></span> ` : ''}${esc(dxTexto(O.data[f]))}</td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">Sin hallazgos. Elige una herramienta y toca las caras o los dientes.</div>'}</div>`;

function odoClick(el) {
  const O = S.ui.odo; if (!O) return;
  const fdi = +el.dataset.fdi, cara = el.dataset.cara; let tool = O.tool;
  if (tool === 'sel') { O.sel = O.sel.includes(fdi) ? O.sel.filter(x => x !== fdi) : [...O.sel, fdi].sort((a, b) => D_TODOS.indexOf(a) - D_TODOS.indexOf(b)); render(); return; }
  if (tool === 'ver') { O.ver = fdi; render(); return; }
  const t = dNorm(O.data[fdi]), grupo = tool.slice(0, 2);
  tool = tool.slice(2);
  if (grupo === 'c:') {
    if (!cara) { toast('Toca una cara del diente para pintarla.'); return; }
    if (tool === 'borrar' || t.caras[cara] === tool) delete t.caras[cara]; else t.caras[cara] = tool;
    if (t.estado === 'ausente') t.estado = 'presente';
  } else if (grupo === 'd:' && T_DIENTE[tool]) {
    const d = T_DIENTE[tool];
    if (d.g === 'reset') { Object.assign(t, dVacio(), { nota: t.nota }); }
    else if (d.g === 'estado') { t.estado = t.estado === tool ? 'presente' : tool; if (tool === 'ausente' || tool === 'implante') { t.caras = {}; t.hall = t.hall.filter(h => h === 'extraccion' && tool !== 'ausente'); if (tool === 'ausente') t.prev = []; } }
    else { const arr = t[d.g]; const i = arr.indexOf(tool); if (i >= 0) arr.splice(i, 1); else arr.push(tool); }
  }
  if (dTieneAlgo(t)) O.data[fdi] = t; else delete O.data[fdi];
  O.dirty = true; O.ver = fdi; render();
}
async function odoGuardar() {
  const O = S.ui.odo, p = get('pacientes', O.pacId), ex = get('expedientes', p.id);
  const data = { pacienteId: p.id, odontograma: O.data };
  if (!ex?.odoInicial) { data.odoInicial = deep(O.data); data.odoInicialFecha = nowISO(); }
  await guardarLote([{ col: 'expedientes', id: p.id, data, nuevo: !ex }], `Actualizó el odontograma de ${nombreCompleto(p)}`);
  O.dirty = false; toast(ex?.odoInicial ? 'Odontograma guardado.' : 'Odontograma guardado. También quedó como "cómo llegó" el paciente.'); render();
}
